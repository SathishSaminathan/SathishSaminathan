<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
  <title id="t">Sathish Saminathan</title>
  <desc id="d">Software engineer building web and mobile apps with React and React Native. A browser and a phone show the same toggle switch turning on.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .track { fill: #C9D1D9; animation: on .45s ease .9s forwards; }
    .track.p { animation-delay: 1.05s; }
    .knob { fill: #FFFFFF; }
    .kb { animation: kb .45s cubic-bezier(.3,.8,.3,1) .9s forwards; }
    .kp { animation: kp .45s cubic-bezier(.3,.8,.3,1) 1.05s forwards; }
    @keyframes on { to { fill: #149ECA; } }
    @keyframes kb { to { transform: translateX(22px); } }
    @keyframes kp { to { transform: translateX(18px); } }
    @media (prefers-reduced-motion: reduce) {
      .track, .kb, .kp { animation: none; }
      .track { fill: #149ECA; }
      .kb { transform: translateX(22px); }
      .kp { transform: translateX(18px); }
    }
  </style>
